# Shape of the Ultralytics compromise (December 2024): a poisoned GitHub Actions
# cache reached the job that built and published releases to PyPI.
# Pinfold: a job feeding the publish job may not restore a cache (PF305).
version: 0
workflows:
  release:
    on: { push: { tags: ["v*"] } }
    jobs:
      build:
        runner: ubuntu-24.04
        steps:
          - checkout: {}
          - uses: actions/setup-python@v7
            with: { cache: pip }
          - run: python -m pip install build && python -m build
        produces: { dist: dist/ }
      publish:
        runner: ubuntu-24.04
        needs: [build]
        environment: pypi
        permissions: { id-token: write }
        consumes: { dist: { from: build, to: dist/ } }
        steps:
          - uses: pypa/gh-action-pypi-publish@v1.14.3
