title: "RFC: "
body:
  - type: markdown
    attributes:
      value: |
        An RFC proposes a change to the spec language, trust zones, taint, the verifier, the lock, or what Pinfold guarantees (design §2). See [GOVERNANCE.md](https://github.com/pinfold-ci/pinfold/blob/main/GOVERNANCE.md). Accepted RFCs are recorded as ADRs in `docs/adr/`.

        **Found a way to break a guarantee?** Don't post it here: report it privately ([SECURITY.md](https://github.com/pinfold-ci/pinfold/blob/main/SECURITY.md)).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't users do today, or what goes wrong? Include a spec snippet if you can.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change, concretely. New spec keys, diagnostics or generated output, with examples.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Which design §2 claims does this touch? Could it let user code or event data reach a job that holds credentials? What new checks would the verifier need?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other designs, and why this one is better. "Do nothing" counts.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and migration
      description: Does any existing spec stop compiling, or compile to different output? How do users migrate?
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I searched existing discussions and issues for this.
          required: true
        - label: This doesn't disclose an unfixed vulnerability.
          required: true
