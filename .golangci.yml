version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # Writes to the CLI's stdout/stderr have nowhere to report failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
formatters:
  enable:
    - gofmt
    - goimports
